[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chargeopt"
version = "0.1.0"
description = "EV fleet charging intelligence: demand forecast → charging decision → simulation → evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Donald Nguyen" }]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
]

[project.scripts]
chargeopt = "chargeopt.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=chargeopt",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]

[tool.coverage.run]
source = ["chargeopt"]
omit = [
    "src/chargeopt/__main__.py",
    "src/chargeopt/data/*",
    "src/chargeopt/features/*",
    "src/chargeopt/models/*",
    "src/chargeopt/optimization/*",
    "src/chargeopt/simulation/*",
    "src/chargeopt/evaluation/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
